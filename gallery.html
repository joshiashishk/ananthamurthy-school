<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Ananthamurthy International School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-stone-50">
  <div id="navbar-placeholder"></div>

  <!-- Hero -->
  <section class="hero-section" style="background-image: url('https://ananthamurthyacademy.org/images/banner_004.jpg'); min-height: 35vh;">
    <div class="hero-overlay"></div>
    <div class="hero-content max-w-6xl mx-auto px-6 py-14 text-white">
      <nav class="text-teal-200 text-sm mb-4">
        <a href="index.html" class="hover:text-yellow-300">Home</a>
        <span class="mx-2">›</span>
        <span class="text-white font-semibold">Gallery</span>
      </nav>
      <h1 class="text-3xl md:text-5xl font-bold mb-3">Gallery</h1>
      <p class="text-teal-100 text-lg">Life at Ananthamurthy International School.</p>
    </div>
  </section>

  <div class="max-w-6xl mx-auto px-4 py-16">

    <!-- Filter buttons -->
    <div class="flex flex-wrap gap-3 mb-8" id="filter-buttons">
      <button class="filter-btn active bg-teal-800 text-white px-5 py-2 rounded-full text-sm font-semibold" data-filter="all">All</button>
      <button class="filter-btn bg-white border border-teal-200 text-teal-800 hover:bg-teal-50 px-5 py-2 rounded-full text-sm font-semibold" data-filter="campus">Campus</button>
      <button class="filter-btn bg-white border border-teal-200 text-teal-800 hover:bg-teal-50 px-5 py-2 rounded-full text-sm font-semibold" data-filter="events">Events</button>
      <button class="filter-btn bg-white border border-teal-200 text-teal-800 hover:bg-teal-50 px-5 py-2 rounded-full text-sm font-semibold" data-filter="keraleeyam">Keraleeyam</button>
    </div>

    <!-- Image grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="gallery-grid">
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner-01.jpg"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner_001.jpg"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner_002.JPG"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner_003.jpg"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner_004.jpg"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner_005.jpg"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="events">
        <img src="https://ananthamurthyacademy.org/events/thumbs/clap-events-ananthamurthy-academy.jpg"
             alt="CLAP Programme" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="keraleeyam">
        <img src="https://ananthamurthyacademy.org/events/thumbs/keraleeyam.jpg"
             alt="Keraleeyam" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
      <div class="gallery-item" data-category="campus">
        <img src="https://ananthamurthyacademy.org/images/banner-04.jpg"
             alt="School campus" class="w-full h-48 object-cover rounded-xl cursor-pointer hover:opacity-90 transition-opacity shadow-sm" />
      </div>
    </div>

  </div>

  <!-- Lightbox overlay (same pattern as screen-break-reminder app) -->
  <div class="lightbox hidden" id="lightbox">
    <div class="relative max-w-4xl w-full">
      <button id="lightbox-close"
              class="absolute -top-10 right-0 text-white text-3xl font-light hover:text-yellow-300 leading-none">✕</button>
      <img id="lightbox-img" src="" alt="" class="w-full max-h-screen object-contain rounded-xl shadow-2xl" />
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="assets/js/components.js"></script>
  <script>
    // ===== LIGHTBOX =====
    const lightbox     = document.getElementById('lightbox');
    const lightboxImg  = document.getElementById('lightbox-img');
    const closeBtn     = document.getElementById('lightbox-close');

    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.remove('hidden');
      });
    });

    function closeLightbox() { lightbox.classList.add('hidden'); }
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    // ===== FILTER =====
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;

        // Update active button style
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-teal-800', 'text-white');
          b.classList.add('bg-white', 'border', 'border-teal-200', 'text-teal-800');
        });
        btn.classList.add('bg-teal-800', 'text-white');
        btn.classList.remove('bg-white', 'border', 'border-teal-200', 'text-teal-800');

        // Show / hide items
        document.querySelectorAll('.gallery-item').forEach(item => {
          item.style.display = (filter === 'all' || item.dataset.category === filter) ? 'block' : 'none';
        });
      });
    });
  </script>
</body>
</html>
