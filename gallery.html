<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stories &amp; Gallery — Ananthamurthy International School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/editorial.css" />
</head>
<body>
  <header class="site"><div id="navbar-placeholder"></div></header>

  <div class="page-hero-photo">
    <img src="assets/images/images/banner7.jpg" alt="Ananthamurthy International School campus" />
  </div>
  <div class="wrap page-hero-copy">
    <p class="crumb"><a href="index.html">Home</a> › Stories &amp; Gallery</p>
    <h1>Stories &amp; Gallery</h1>
    <p class="lede">Life at Ananthamurthy International School.</p>
  </div>

  <section class="section" style="border-top:none; padding-top:0;">
    <div class="wrap">
      <div class="filters" id="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="campus">Campus</button>
        <button class="filter-btn" data-filter="events">Events</button>
        <button class="filter-btn" data-filter="programmes">Programmes</button>
        <button class="filter-btn" data-filter="keraleeyam">Keraleeyam</button>
        <button class="filter-btn" data-filter="community">Community</button>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head row">
        <div>
          <p class="eyebrow">School Life</p>
          <h2>Videos</h2>
        </div>
        <a class="textlink" href="https://www.youtube.com/@ananthamurthyinternational4855" target="_blank" rel="noreferrer">More on the school's YouTube channel →</a>
      </div>
      <div class="video-grid" id="video-grid"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-inner">
      <button id="lightbox-close" aria-label="Close">✕</button>
      <img id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <footer class="site"><div id="footer-placeholder"></div></footer>
  <script src="assets/js/editorial-nav.js?v=20261016"></script>
  <script>
    const galleryPhotos = [
      { src: 'assets/images/images/banner1.jpg', alt: 'Ananthamurthy school campus', category: 'campus' },
      { src: 'assets/images/images/banner2.jpg', alt: 'School grounds', category: 'campus' },
      { src: 'assets/images/images/banner3.jpg', alt: 'School building and grounds', category: 'campus' },
      { src: 'assets/images/images/banner4.jpg', alt: 'School campus', category: 'campus' },
      { src: 'assets/images/images/banner5.jpg', alt: 'Learning spaces at school', category: 'campus' },
      { src: 'assets/images/images/banner6.jpg', alt: 'School grounds', category: 'campus' },
      { src: 'assets/images/images/banner7.jpg', alt: 'School campus', category: 'campus' },
      { src: 'assets/images/images/banner8.jpg', alt: 'School building', category: 'campus' },
      { src: 'assets/images/images/banner9.jpg', alt: 'School campus', category: 'campus' },
      {
        src: 'assets/images/external/padmanabhapuram-palace-wikimedia.jpg',
        alt: 'Padmanabhapuram Palace, a Travancore-era heritage site visited as part of Keraleeyam',
        category: 'keraleeyam',
        credit: 'Reference photo, not the school’s own — Timothy A. Gonsalves / <a href="https://commons.wikimedia.org/wiki/File:Forecourt_Padmanabhapuram_Palace_Mar24_A7C_10099.jpg" target="_blank" rel="noreferrer">Wikimedia Commons</a>, CC BY-SA 4.0'
      },
      { src: 'assets/images/images/kalari_01.jpg', alt: 'Kalarippayattu training', category: 'programmes' },
      { src: 'assets/images/images/kalari_02.jpg', alt: 'Kalarippayattu training', category: 'programmes' },
      { src: 'assets/images/images/kalari_03.jpg', alt: 'Kalarippayattu training', category: 'programmes' },
      { src: 'assets/images/images/Picture1.png', alt: 'School music programme', category: 'programmes' },
      { src: 'assets/images/images/Picture2.jpg', alt: 'School music programme', category: 'programmes' },
      { src: 'assets/images/events/clap-events-ananthamurthy-academy.jpg', alt: 'CLAP school event', category: 'community' },
      { src: 'assets/images/images/patron-cochin-shipyard.jpg', alt: 'Cochin Shipyard patron', category: 'community' },
      { src: 'assets/images/images/patron-manappuram-foundation.jpg', alt: 'Manappuram Foundation patron', category: 'community' },
      { src: 'assets/images/images/patron-new-rajasthan-marbles.jpg', alt: 'New Rajasthan Marbles patron', category: 'community' },
      { src: 'assets/images/images/with_our_leading_light_ananthamurthy_ananthamurthy-academy.jpg', alt: 'Ananthamurthy, the school’s leading light', category: 'community' }
    ];

    const galleryGrid = document.getElementById('gallery-grid');
    galleryPhotos.forEach((photo) => {
      const item = document.createElement('figure');
      item.className = 'gallery-item';
      item.dataset.category = photo.category;
      item.innerHTML = `
        <img src="${photo.src}" alt="${photo.alt}" loading="lazy" />
        ${photo.credit ? `<figcaption>${photo.credit}</figcaption>` : ''}
      `;
      galleryGrid.append(item);
    });

    // Videos from the school's official YouTube channel (Ananthamurthy International),
    // verified individually — titles below are each video's real published YouTube title.
    const schoolVideos = [
      { id: '22Z2lmA7twg', title: "Kalarippayattu flexibility exercises at Crescendo '25" },
      { id: '8UduQR_frCQ', title: "“Blowin’ in the Wind” (Bob Dylan cover) — a performance at Crescendo '25" },
      { id: 'ZeEWRcH7nzs', title: "Stage 6 presents the poem ‘Athirum Thala’ by Kavalam Narayana Panicker" },
      { id: 'yyhrRGhxfVk', title: 'Ona Pookkalam — the Onam flower carpet' },
      { id: 'Kn0fB2erZCc', title: 'A Keraleeyam visit to the Kottangal Valiya Padayani' },
      { id: 'F8R7vYNsFaQ', title: 'A Keraleeyam visit to Padmanabhapuram Palace' },
      { id: 'Py9iLYWnADc', title: "Students perform 'The Comedy of Errors'" },
      { id: 'TMpjvZ7kUAg', title: 'Cambridge Stage 2–3 science: the life cycle of flowering plants' },
    ];

    const videoGrid = document.getElementById('video-grid');
    schoolVideos.forEach((video) => {
      const item = document.createElement('figure');
      item.className = 'video-card';
      item.innerHTML = `
        <div class="video-frame">
          <iframe loading="lazy"
                  src="https://www.youtube-nocookie.com/embed/${video.id}"
                  title="${video.title}" frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
        </div>
        <figcaption>${video.title}</figcaption>
      `;
      videoGrid.append(item);
    });

    // ===== LIGHTBOX =====
    const lightbox     = document.getElementById('lightbox');
    const lightboxImg  = document.getElementById('lightbox-img');
    const closeBtn     = document.getElementById('lightbox-close');

    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.hidden = false;
      });
    });

    function closeLightbox() { lightbox.hidden = true; }
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    // ===== FILTER =====
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;

        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));

        // Show / hide items
        document.querySelectorAll('.gallery-item').forEach(item => {
          item.style.display = (filter === 'all' || item.dataset.category === filter) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
